# ============================================================
# 新蓝恒成网站 - Docker Compose 生产部署编排
# ------------------------------------------------------------
# 使用方式：
#   1. 复制 .env.production.example 为 .env 并修改实际值
#   2. 构建并启动：docker compose --env-file .env up -d --build
#   3. 查看日志：docker compose logs -f
#   4. 停止：docker compose down
#   5. 清理数据重建：docker compose down -v
# ============================================================

services:
  # ==================== 后端服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xinlan-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # 数据库路径（容器内，挂载到命名卷持久化）
      - DATABASE_URL=file:/app/data/prod.db
      # JWT 配置 [必须修改] - 建议通过 .env 文件注入强随机字符串
      - JWT_SECRET=${JWT_SECRET:-CHANGE_ME_TO_A_STRONG_RANDOM_STRING}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      # 前端地址（CORS 白名单），生产环境填实际域名
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # 限流配置
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
    volumes:
      # 数据库文件持久化（避免容器重建后数据丢失）
      - backend-data:/app/data
      # 用户上传图片持久化
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - xinlan-net

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建时注入后端 API 地址（NEXT_PUBLIC_* 仅在构建时生效）
        - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:3001/api}
    container_name: xinlan-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - xinlan-net

# ==================== 持久化卷 ====================
volumes:
  # 后端 SQLite 数据库文件
  backend-data:
    driver: local
  # 后端用户上传文件
  backend-uploads:
    driver: local

# ==================== 网络 ====================
networks:
  xinlan-net:
    driver: bridge
