<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E8EEF6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46566B"/><stop offset="0.5" stop-color="#2E3A4A"/><stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#12233F"/>
    </linearGradient>
    <linearGradient id="brandgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.35"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2563EB" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  <circle cx="1050" cy="130" r="230" fill="url(#glow)"/>
  <circle cx="140" cy="790" r="200" fill="url(#glow)"/>
  <g transform="translate(90 0) scale(0.86 1) skewY(-2)">
    <g>
    <ellipse cx="600" cy="650" rx="400" ry="20" fill="#0B1220" opacity="0.10"/>
    <rect x="180" y="200" width="840" height="420" rx="16" fill="url(#metal)"/>
    <rect x="206" y="226" width="788" height="368" rx="8" fill="url(#screen)"/>
    <rect x="206" y="226" width="788" height="368" rx="8" fill="url(#brandgrad)" opacity="0.12"/>
    <rect x="250" y="270" width="300" height="26" rx="8" fill="#60A5FA" opacity="0.9"/>
    <rect x="250" y="324" width="560" height="18" rx="9" fill="#FFFFFF" opacity="0.26"/><rect x="250" y="368" width="470" height="18" rx="9" fill="#FFFFFF" opacity="0.26"/><rect x="250" y="412" width="380" height="18" rx="9" fill="#FFFFFF" opacity="0.26"/>
    <rect x="250" y="486" width="170" height="52" rx="26" fill="url(#brandgrad)"/>
    <rect x="448" y="486" width="170" height="52" rx="26" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <rect x="430" y="620" width="60" height="34" fill="#2E3A4A"/>
    <rect x="330" y="652" width="260" height="14" rx="7" fill="#2E3A4A"/>
    <circle cx="600" cy="214" r="5" fill="#22C55E"/>
  </g>
  </g>
  <g opacity="0.9">
    <rect x="930" y="300" width="60" height="280" rx="10" fill="#1F2937"/>
    <circle cx="960" cy="330" r="6" fill="#22C55E"/><circle cx="960" cy="382" r="6" fill="#22C55E"/><circle cx="960" cy="434" r="6" fill="#22C55E"/><circle cx="960" cy="486" r="6" fill="#22C55E"/><circle cx="960" cy="538" r="6" fill="#22C55E"/>
    <text x="960" y="620" font-size="20" fill="#64748B" text-anchor="middle">侧面散热与接口</text>
  </g>
  <!-- 底部信息条 -->
  <rect x="0" y="804" width="1200" height="96" fill="#FFFFFF" opacity="0.86"/>
  <rect x="0" y="804" width="1200" height="3" fill="url(#brandgrad)"/>
  <text x="60" y="866" font-size="34" font-weight="600" fill="#334155">希沃常态化录播主机（RV系列）</text>
  <g transform="translate(1140, 834)">
    <rect x="-260" y="0" width="260" height="42" rx="21" fill="none" stroke="#2563EB" stroke-width="2"/>
    <text x="-130" y="29" font-size="22" fill="#2563EB" text-anchor="middle">希沃教育信息化产品系列</text>
  </g>
  <!-- 视角标签 -->
  <g transform="translate(1140, 60)">
    <rect x="-150" y="-28" width="150" height="44" rx="8" fill="#2E3A4A" opacity="0.92"/>
    <text x="-75" y="2" font-size="22" fill="#FFFFFF" text-anchor="middle">侧面视图</text>
  </g>
