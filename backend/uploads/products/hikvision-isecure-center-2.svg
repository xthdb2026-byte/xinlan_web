    <rect x="300" y="330" width="600" height="190" rx="95" fill="url(#metal)"/>
    <rect x="330" y="300" width="420" height="30" rx="15" fill="#1F2937"/>
    <circle cx="890" cy="425" r="120" fill="#1F2937"/>
    <circle cx="890" cy="425" r="88" fill="url(#screen)"/>
    <circle cx="890" cy="425" r="44" fill="#2563EB" opacity="0.9"/>
    <circle cx="890" cy="425" r="16" fill="#38BDF8"/>
    <circle cx="956" cy="425" r="9" fill="#F59E0B" opacity="0.85"/><circle cx="890" cy="491" r="9" fill="#F59E0B" opacity="0.85"/><circle cx="824" cy="425" r="9" fill="#F59E0B" opacity="0.85"/><circle cx="890" cy="359" r="9" fill="#F59E0B" opacity="0.85"/>
    <rect x="470" y="470" width="90" height="12" rx="6" fill="#2563EB" opacity="0.8"/>
    <circle cx="360" cy="425" r="10" fill="#22C55E"/>
  </g>
  </g>
  <g opacity="0.9">
    <rect x="930" y="300" width="60" height="280" rx="10" fill="#1F2937"/>
    <circle cx="960" cy="330" r="6" fill="#22C55E"/><circle cx="960" cy="382" r="6" fill="#22C55E"/><circle cx="960" cy="434" r="6" fill="#22C55E"/><circle cx="960" cy="486" r="6" fill="#22C55E"/><circle cx="960" cy="538" r="6" fill="#22C55E"/>
    <text x="960" y="620" font-size="20" fill="#64748B" text-anchor="middle">侧面散热与接口</text>
  </g>
  <!-- 底部信息条 -->
  <rect x="0" y="804" width="1200" height="96" fill="#FFFFFF" opacity="0.86"/>
