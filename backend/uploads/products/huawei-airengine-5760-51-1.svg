<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E8EEF6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46566B"/><stop offset="0.5" stop-color="#2E3A4A"/><stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#12233F"/>
    </linearGradient>
    <linearGradient id="brandgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.35"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2563EB" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  <circle cx="1050" cy="130" r="230" fill="url(#glow)"/>
  <circle cx="140" cy="790" r="200" fill="url(#glow)"/>
  <g>
    <ellipse cx="600" cy="650" rx="300" ry="22" fill="#0B1220" opacity="0.10"/>
    <circle cx="600" cy="440" r="200" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="3"/>
    <circle cx="600" cy="440" r="160" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="600" cy="440" r="60" fill="none" stroke="#2563EB" stroke-width="5" opacity="0.9"/>
    <circle cx="600" cy="440" r="60" fill="none" stroke="#2563EB" stroke-width="5" opacity="0.25" stroke-dasharray="30 14"/>
    <circle cx="600" cy="440" r="12" fill="#22C55E"/>
    <circle cx="720" cy="440" r="7" fill="#38BDF8" opacity="0.7"/><circle cx="660" cy="543.9230484541326" r="7" fill="#38BDF8" opacity="0.7"/><circle cx="540" cy="543.9230484541326" r="7" fill="#38BDF8" opacity="0.7"/><circle cx="480" cy="440" r="7" fill="#38BDF8" opacity="0.7"/><circle cx="540" cy="336.07695154586736" r="7" fill="#38BDF8" opacity="0.7"/><circle cx="660" cy="336.07695154586736" r="7" fill="#38BDF8" opacity="0.7"/>
  </g>
  <!-- 底部信息条 -->
  <rect x="0" y="804" width="1200" height="96" fill="#FFFFFF" opacity="0.86"/>
  <rect x="0" y="804" width="1200" height="3" fill="url(#brandgrad)"/>
  <text x="60" y="866" font-size="34" font-weight="600" fill="#334155">华为 AirEngine 5760-51 室内Wi-Fi 6无线AP</text>
  <g transform="translate(1140, 834)">
    <rect x="-260" y="0" width="260" height="42" rx="21" fill="none" stroke="#2563EB" stroke-width="2"/>
    <text x="-130" y="29" font-size="22" fill="#2563EB" text-anchor="middle">华为网络产品系列</text>
  </g>
  <!-- 视角标签 -->
  <g transform="translate(1140, 60)">
    <rect x="-150" y="-28" width="150" height="44" rx="8" fill="#2E3A4A" opacity="0.92"/>
    <text x="-75" y="2" font-size="22" fill="#FFFFFF" text-anchor="middle">正面视图</text>
  </g>
</svg>