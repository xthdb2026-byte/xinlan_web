      <circle cx="296" cy="460" r="3" fill="#22C55E"/><rect x="342" y="422" width="42" height="48" rx="4" fill="#1F2937" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="352" cy="460" r="3" fill="#22C55E"/><rect x="398" y="422" width="42" height="48" rx="4" fill="#1F2937" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="408" cy="460" r="3" fill="#22C55E"/><rect x="454" y="422" width="42" height="48" rx="4" fill="#1F2937" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="464" cy="460" r="3" fill="#22C55E"/><rect x="510" y="422" width="42" height="48" rx="4" fill="#1F2937" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="520" cy="460" r="3" fill="#22C55E"/><rect x="566" y="422" width="42" height="48" rx="4" fill="#1F2937" stroke="#64748B" stroke-width="1.2"/>
