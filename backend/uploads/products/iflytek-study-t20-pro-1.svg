<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E8EEF6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46566B"/><stop offset="0.5" stop-color="#2E3A4A"/><stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#12233F"/>
    </linearGradient>
    <linearGradient id="brandgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.35"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2563EB" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  <circle cx="1050" cy="130" r="230" fill="url(#glow)"/>
  <circle cx="140" cy="790" r="200" fill="url(#glow)"/>
  <g>
    <ellipse cx="600" cy="664" rx="340" ry="18" fill="#0B1220" opacity="0.10"/>
    <rect x="260" y="230" width="560" height="400" rx="18" fill="url(#metal)"/>
    <rect x="278" y="248" width="524" height="364" rx="8" fill="url(#screen)"/>
    <rect x="304" y="282" width="280" height="20" rx="6" fill="#60A5FA" opacity="0.85"/>
    <rect x="304" y="326" width="472" height="14" rx="7" fill="#FFFFFF" opacity="0.28"/><rect x="304" y="362" width="432" height="14" rx="7" fill="#FFFFFF" opacity="0.28"/><rect x="304" y="398" width="392" height="14" rx="7" fill="#FFFFFF" opacity="0.28"/><rect x="304" y="434" width="352" height="14" rx="7" fill="#FFFFFF" opacity="0.28"/>
    <rect x="304" y="538" width="150" height="40" rx="20" fill="url(#brandgrad)"/>
    <circle cx="790" cy="260" r="7" fill="#22C55E"/>
    <rect x="854" y="390" width="14" height="220" rx="7" fill="#1F2937" transform="rotate(6 860 630)"/>
  </g>
  <!-- 底部信息条 -->
  <rect x="0" y="804" width="1200" height="96" fill="#FFFFFF" opacity="0.86"/>
  <rect x="0" y="804" width="1200" height="3" fill="url(#brandgrad)"/>
  <text x="60" y="866" font-size="34" font-weight="600" fill="#334155">科大讯飞AI学习机 T20 Pro</text>
  <g transform="translate(1140, 834)">
    <rect x="-260" y="0" width="260" height="42" rx="21" fill="none" stroke="#2563EB" stroke-width="2"/>
    <text x="-130" y="29" font-size="22" fill="#2563EB" text-anchor="middle">科大讯飞智能产品系列</text>
  </g>
  <!-- 视角标签 -->
  <g transform="translate(1140, 60)">
    <rect x="-150" y="-28" width="150" height="44" rx="8" fill="#2E3A4A" opacity="0.92"/>
    <text x="-75" y="2" font-size="22" fill="#FFFFFF" text-anchor="middle">正面视图</text>
  </g>
</svg>